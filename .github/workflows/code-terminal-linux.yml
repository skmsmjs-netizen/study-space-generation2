name: Linux interactive terminal
on:
  workflow_dispatch:
  push:
    branches: [codex/online-code-terminal]
    paths: ['server/code-terminal/**', '.github/workflows/code-terminal-linux.yml']
permissions:
  contents: read
jobs:
  app:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test -- --maxWorkers=2 --hookTimeout=120000 --testTimeout=60000
      - run: npm run build:backend
      - run: npm run build
        env:
          PAGES_BASE: /study-space-generation2/
      - run: npx vite build --config tools/code-terminal-ui/vite.config.ts
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config playwright.code-terminal.config.ts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: online-terminal-mobile-verification
          path: |
            work/code-terminal-mobile-results.json
            work/code-terminal-mobile-traces
  terminal:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install standard Linux isolation
        run: sudo bash server/code-terminal/install-isolate.sh
      - name: Check native compilers
        run: |
          gcc --version
          g++ --version
          dotnet --list-sdks
          test -x /usr/bin/dotnet
      - run: npm ci
        working-directory: server/code-terminal
      - name: Verify gateway and real isolated C, C++, Csharp
        run: npm test && npm run test:linux
        working-directory: server/code-terminal
