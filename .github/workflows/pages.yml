name: Native field diagnostic only
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quota-native-field-diagnostic
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm run build
      - run: npx playwright install --with-deps webkit
      - run: npx playwright test --config playwright.devices.config.ts e2e/devices/quota-native-probe.pw.ts --project=iPhone-17-Pro-portrait --project=iPhone-17-Pro-landscape --workers=2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quota-native-field-diagnostic
          path: work/device-results.json
          retention-days: 1
