name: Verify and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        env:
          # Browser builds use ONNX Web; CPU Node files are already bundled.
          # Do not fetch unused CUDA binaries from NuGet during a Pages build.
          ONNXRUNTIME_NODE_INSTALL: skip
      - run: npm test -- --maxWorkers=2 --testTimeout=60000
      - run: npm run build:backend
      - run: npm run build
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - run: npx playwright install --with-deps webkit
      - name: Verify all agreed device environments
        run: npm run test:devices
        env:
          PAGES_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-verification
          path: |
            work/device-report
            work/device-results.json
            work/device-traces
            work/device-runs/**/report/**
            work/device-runs/**/results.json
            work/device-runs/**/traces/**
            work/device-runs/**/build-manifest.json
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
