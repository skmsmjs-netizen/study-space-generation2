# 모델·권한·MCP·사용자 전역 설정은 현재 설정을 상속합니다.
# 프로젝트와 아래 훅 정의의 신뢰가 승인된 실행에서 SessionStart가 작동합니다.
[[hooks.SessionStart]]
matcher = "^(startup|resume|compact)$"

[[hooks.SessionStart.hooks]]
type = "command"
command = 'python3 "$(git rev-parse --show-toplevel)/.codex/hooks/session-start.py"'
timeout = 5
statusMessage = "학습 입력 지침 연결 확인"
additionalContextLimit = 800
