<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/><meta name="theme-color" content="#f5f4ef"/><meta name="description" content="공부의 흐름을 잇는 개인 학습 공간"/><link rel="preconnect" href="https://lbuiwotjisbzgflixjvg.supabase.co" crossorigin/><link rel="manifest" href="%BASE_URL%manifest.webmanifest"/><link rel="icon" href="%BASE_URL%study-space-icon.svg" type="image/svg+xml"/><title>manseeksong os</title>
<script id="app-boot-recovery">
// This guard must run before the module entry; it cannot depend on its assets.
(function () {
  window.addEventListener('error', function (event) {
    var source = event.target;
    if (!(source instanceof HTMLScriptElement) || source.type !== 'module' || !source.src) return;
    var root = document.getElementById('root');
    if (!root || root.childElementCount) return;
    var main = document.createElement('main');
    main.setAttribute('role', 'alert');
    main.style.cssText = 'max-width:36rem;margin:12vh auto;padding:1.5rem;font:1rem/1.7 system-ui,sans-serif;color:#282824;background:#f5f4ef;border-radius:12px';
    var title = document.createElement('h1');
    title.textContent = '공부 공간을 불러오지 못했습니다';
    title.style.fontSize = '1.35rem';
    var message = document.createElement('p');
    message.textContent = '앱 파일을 불러오지 못했습니다. 연결을 확인한 뒤 화면을 다시 열어 주세요. 이 동작은 저장된 기록과 초안을 지우지 않습니다.';
    var button = document.createElement('button');
    button.type = 'button';
    button.textContent = '화면 다시 열기';
    button.style.cssText = 'font:inherit;padding:.5rem 1rem;cursor:pointer';
    button.addEventListener('click', function () {
      var url = new URL(window.location.href);
      url.searchParams.set('_reload', String(Date.now()));
      window.location.replace(url.href);
    });
    main.append(title, message, button);
    root.append(main);
  }, true);
}());
</script>
</head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
