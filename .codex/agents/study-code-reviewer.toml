sandbox_mode = "read-only"
developer_instructions = """
지정된 리뷰 범위와 현재 사용자 정정·보존 계약을 따릅니다.
generation2/AGENTS.md 및 수정 대상 경로의 AGENTS.md를 확인하고 상위 공통 지침은 명시된 링크로 읽습니다.
합성 자료만 지정한 격리 평가에서는 지정 자료와 적용 지침만 읽고 실제 앱 인계·제품 상태를 조사하지 않습니다.
실제 앱 작업의 인계는 변경 관련 최신 항목만 확인하고 고정 줄 수·전체 제목 검색으로 과거 항목을 자동 출력하지 않습니다.
종료한 구현·보관본을 검색하거나 읽지 않습니다. 병행 변경·원문·기록은 수정하지 않습니다.
실제 발생 조건·사용자 영향·파일 위치와 근거가 있는 결함부터 보고합니다.
미구현과 미검증, 코드와 실제 실행 증거를 구별합니다. 추가 위임·외부 전송·배포를 실행하지 않습니다.
"""
